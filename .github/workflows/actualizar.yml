name: Actualizar datos y publicar

on:
  schedule:
    - cron: "0 0 * * *" # 21:00 en Argentina
    - cron: "10 19 * * 1-5" # 16:10 en Argentina, días hábiles: el IPC de INDEC sale a las 16:00
    - cron: "15 20 * * 1-5" # 17:15 en Argentina, días hábiles: el parte diario del BCRA (reservas, compras, tasas) sale entre 16:45 y 17:00
  push:
    branches: [main]
    paths:
      - "web/**"
      - "pipeline/**"
      - "requirements.txt"
      - ".github/workflows/actualizar.yml"
  workflow_dispatch:
    inputs:
      aceptar_menos_series:
        description: "Aceptar menos series"
        type: boolean
        default: false
      solo_sitio:
        description: "Solo publicar el sitio (sin bajar datos)"
        type: boolean
        default: false

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hace falta el historial para ver qué archivos trajo el push

      - name: Elegir el modo (completo o solo el sitio)
        id: modo
        shell: bash
        # Solo el sitio: un push que no toca el pipeline, o una corrida a mano con "solo_sitio".
        # Se usan los datos ya guardados en datos/cache (sin red) y la publicación tarda un par de minutos.
        # La corrida programada y cualquier duda van por el camino completo.
        run: |
          MODO=completo
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.solo_sitio }}" = "true" ]; then
            MODO=sitio
          elif [ "${{ github.event_name }}" = "push" ]; then
            ANTES="${{ github.event.before }}"
            if CAMBIOS=$(git diff --name-only "$ANTES" "${{ github.sha }}" 2>/dev/null) && [ -n "$CAMBIOS" ] \
               && ! echo "$CAMBIOS" | grep -qE '^(pipeline/|datos/|requirements\.txt$|\.github/workflows/)'; then
              MODO=sitio
            fi
          fi
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODO" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bajar datos y generar los JSON de la web
        env:
          INDEC_TOKEN: ${{ secrets.INDEC_TOKEN }}
        shell: bash # con pipefail: si el pipeline falla, el paso falla
        run: |
          ARGS=""
          if [ "${{ steps.modo.outputs.modo }}" = "sitio" ]; then ARGS="--solo-json"; fi
          python pipeline/obtener_datos.py $ARGS 2>&1 | tee pipeline.log

      - name: Resumen de fuentes
        # Corre aunque el pipeline falle, para ver el log en el resumen. Lo que sigue no corre.
        if: always() && hashFiles('pipeline.log') != ''
        run: |
          {
            echo "## Actualización de datos"
            echo
            echo "### Fuentes con problemas"
            if grep -iE "uso cache|error|no disponible|Sin INDEC_TOKEN" pipeline.log > problemas.log; then
              echo '```'; cat problemas.log; echo '```'
            else
              echo "Todas las fuentes respondieron"
            fi
            echo
            grep -m1 "Fuente de precios e IPC:" pipeline.log | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar series
        run: |
          ARGS=""
          if [ "${{ inputs.aceptar_menos_series }}" = "true" ]; then ARGS="--aceptar-menos"; fi
          python pipeline/verificar_series.py $ARGS

      - name: Commitear datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/cache datos/series_esperadas.txt
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            FECHA=$(TZ=America/Argentina/Buenos_Aires date +%F)
            git commit -m "Actualizar datos $FECHA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Compilar el sitio (Next.js)
        working-directory: web
        run: |
          npm ci
          npm run build
          {
            echo "- Tamaño del sitio: $(du -sh out | cut -f1)"
            echo "- Sitio: https://primerolosdatos.com.ar"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Crear proyecto de Cloudflare si no existe
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create duelo-de-datos --production-branch=main

      - name: Publicar en Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/out --project-name=duelo-de-datos --branch=main
